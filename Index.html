<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoktorOS 1.0 — Linux Distribution</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Rajdhani:wght@300;400;500;600;700&display=swap');

  :root {
    --bg:        #0a0c10;
    --panel:     #0f1319;
    --border:    #1e2530;
    --accent:    #00d4aa;
    --accent2:   #0090ff;
    --accent3:   #ff6b35;
    --text:      #c8d3e0;
    --dim:       #4a5568;
    --green:     #39d353;
    --yellow:    #e3b341;
    --red:       #f85149;
    --purple:    #bc8cff;
    --cyan:      #79c0ff;
    --orange:    #ffa657;
    --white:     #f0f6fc;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  #topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 32px;
    gap: 16px;
    font-size: 11px;
    flex-shrink: 0;
  }
  #topbar .logo {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  #topbar .logo span { color: var(--accent2); }
  #topbar .spacer { flex: 1; }
  #topbar .stat { color: var(--dim); }
  #topbar .stat b { color: var(--text); }
  #clock { color: var(--accent); font-weight: 500; }

  /* ── DESKTOP ── */
  #desktop {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  /* ── TASKBAR (left) ── */
  #taskbar {
    width: 48px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 4px;
    z-index: 10;
  }
  .taskbtn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all .15s;
    position: relative;
  }
  .taskbtn:hover, .taskbtn.active {
    background: rgba(0,212,170,.12);
    color: var(--accent);
  }
  .taskbtn .tip {
    display: none;
    position: absolute;
    left: 46px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    font-size: 11px;
    color: var(--text);
    pointer-events: none;
  }
  .taskbtn:hover .tip { display: block; }

  /* ── MAIN AREA ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TABS ── */
  #tabs {
    display: flex;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    gap: 2px;
    flex-shrink: 0;
    overflow-x: auto;
  }
  .tab {
    padding: 6px 14px;
    font-size: 11px;
    color: var(--dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-close {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--dim);
    cursor: pointer;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .tab-close:hover { background: var(--red); color: white; }
  #new-tab-btn {
    padding: 6px 10px;
    font-size: 16px;
    color: var(--dim);
    cursor: pointer;
    background: none; border: none;
    transition: color .15s;
    align-self: center;
  }
  #new-tab-btn:hover { color: var(--accent); }

  /* ── TERMINAL ── */
  #term-container {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    line-height: 1.7;
    font-size: 13px;
  }
  #output::-webkit-scrollbar { width: 6px; }
  #output::-webkit-scrollbar-track { background: transparent; }
  #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .line { display: flex; flex-wrap: wrap; gap: 0; }
  .prompt-line { display: flex; align-items: center; gap: 0; }
  .ps-user { color: var(--green); }
  .ps-at    { color: var(--dim); }
  .ps-host  { color: var(--cyan); }
  .ps-colon { color: var(--dim); }
  .ps-dir   { color: var(--accent2); font-weight: 600; }
  .ps-git   { color: var(--purple); }
  .ps-dollar{ color: var(--accent); margin: 0 6px 0 4px; }
  .ps-cmd   { color: var(--white); }

  .out-line { padding-left: 0; white-space: pre-wrap; word-break: break-all; }
  .c-green  { color: var(--green); }
  .c-yellow { color: var(--yellow); }
  .c-red    { color: var(--red); }
  .c-blue   { color: var(--accent2); }
  .c-cyan   { color: var(--cyan); }
  .c-purple { color: var(--purple); }
  .c-orange { color: var(--orange); }
  .c-dim    { color: var(--dim); }
  .c-accent { color: var(--accent); }
  .c-white  { color: var(--white); }
  .c-bold   { font-weight: 700; }

  /* Input row */
  #input-row {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .input-prompt { display: flex; align-items: center; flex-shrink: 0; font-size: 13px; }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    caret-color: var(--accent);
    margin-left: 4px;
  }

  /* ── PANELS ── */
  #panels {
    width: 280px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 8px 12px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  #file-tree {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    font-size: 12px;
  }
  #file-tree::-webkit-scrollbar { width: 4px; }
  #file-tree::-webkit-scrollbar-thumb { background: var(--border); }

  .tree-item {
    padding: 3px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    transition: background .1s;
    user-select: none;
  }
  .tree-item:hover { background: rgba(255,255,255,.04); }
  .tree-item.dir { color: var(--cyan); }
  .tree-item.exec { color: var(--green); }
  .tree-item.link { color: var(--purple); }
  .tree-item.conf { color: var(--yellow); }
  .tree-indent { display: inline-block; width: 14px; flex-shrink: 0; }

  #sysinfo {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    font-size: 11px;
    flex-shrink: 0;
  }
  .info-row { display: flex; justify-content: space-between; margin: 3px 0; }
  .info-label { color: var(--dim); }
  .info-val   { color: var(--text); }

  .bar-wrap { background: var(--border); border-radius: 2px; height: 4px; margin: 4px 0 8px; }
  .bar-fill  { height: 4px; border-radius: 2px; transition: width .5s; }

  /* ── BOOT SCREEN ── */
  #boot {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 20px;
  }
  #boot .logo-big {
    font-family: 'Rajdhani', sans-serif;
    font-size: 64px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 8px;
  }
  #boot .logo-big span { color: var(--accent2); }
  #boot .version { color: var(--dim); font-size: 13px; letter-spacing: 2px; }
  #boot-log {
    width: 560px;
    max-width: 90vw;
    font-size: 12px;
    line-height: 1.8;
    color: var(--dim);
    height: 180px;
    overflow: hidden;
  }
  #boot-bar-wrap {
    width: 560px; max-width: 90vw;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
  }
  #boot-bar { height: 3px; background: var(--accent); border-radius: 2px; width: 0; transition: width .3s; }

  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* scrollbar for output */
  #output { scrollbar-gutter: stable; }
</style>
</head>
<body>

<!-- BOOT SCREEN -->
<div id="boot">
  <div class="logo-big">Doktor<span>OS</span></div>
  <div class="version">VERSION 1.0.0 LTS — KERNEL 6.8.0-doktoros</div>
  <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
  <div id="boot-log"></div>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">Doktor<span>OS</span></div>
  <div class="stat">kernel <b>6.8.0-doktoros</b></div>
  <div class="stat">uptime <b id="uptime">0:00</b></div>
  <div class="spacer"></div>
  <div class="stat">load <b id="loadavg">0.12</b></div>
  <div class="stat">mem <b id="memuse">412MB</b>/8GB</div>
  <div id="clock">00:00:00</div>
</div>

<!-- DESKTOP -->
<div id="desktop">
  <!-- TASKBAR -->
  <div id="taskbar">
    <button class="taskbtn active" title="terminal" onclick="showApp('terminal')">⌨<span class="tip">Terminal</span></button>
    <button class="taskbtn" onclick="showApp('editor')">📝<span class="tip">Editor</span></button>
    <button class="taskbtn" onclick="showApp('processes')">📊<span class="tip">Processes</span></button>
    <button class="taskbtn" onclick="showApp('network')">🌐<span class="tip">Network</span></button>
    <button class="taskbtn" onclick="showApp('packages')">📦<span class="tip">Packages</span></button>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="tabs">
      <div class="tab active" id="tab-0" onclick="switchTab(0)">
        <span>🖥️ terminal</span>
        <button class="tab-close" onclick="closeTab(event,0)">×</button>
      </div>
      <button id="new-tab-btn" onclick="newTab()">+</button>
    </div>

    <div id="term-container">
      <div id="output"></div>
      <div id="input-row">
        <div class="input-prompt" id="live-prompt"></div>
        <input id="cmd-input" autofocus spellcheck="false" autocomplete="off" placeholder="">
      </div>
    </div>
  </div>

  <!-- SIDE PANELS -->
  <div id="panels">
    <div class="panel-header">📁 File System</div>
    <div id="file-tree"></div>
    <div id="sysinfo">
      <div class="panel-header" style="padding:0 0 6px;border:none">⚙ System</div>
      <div class="info-row"><span class="info-label">OS</span><span class="info-val">DoktorOS 1.0</span></div>
      <div class="info-row"><span class="info-label">Arch</span><span class="info-val">x86_64</span></div>
      <div class="info-row"><span class="info-label">Shell</span><span class="info-val">bash 5.2.21</span></div>
      <div class="info-row"><span class="info-label">CPU</span><span class="info-val">8× @ 3.2GHz</span></div>
      CPU
      <div class="bar-wrap"><div class="bar-fill" id="cpu-bar" style="background:var(--accent);width:12%"></div></div>
      Memory
      <div class="bar-wrap"><div class="bar-fill" id="mem-bar" style="background:var(--accent2);width:5%"></div></div>
      Disk
      <div class="bar-wrap"><div class="bar-fill" id="disk-bar" style="background:var(--orange);width:24%"></div></div>
    </div>
  </div>
</div>

let cwd = '/home/user';
let user = 'user';
let hostname = 'doktoros';
let history = [];
let histIdx = -1;
let envVars = { HOME:'/home/user', USER:'user', SHELL:'/bin/bash', TERM:'xterm-256color', LANG:'en_US.UTF-8', PATH:'/usr/local/bin:/usr/bin:/bin' };
let tabs = [{ title:'terminal', cwd:'/home/user' }];
let activeTab = 0;

function resolvePath(p) {
  if (!p) return cwd;
  if (p === '~') return '/home/user';
  if (p.startsWith('~/')) p = '/home/user' + p.slice(1);
  if (!p.startsWith('/')) {
    // relative
    let base = cwd.endsWith('/') ? cwd : cwd + '/';
    p = base + p;
  }
  // normalize
  let parts = p.split('/').filter(Boolean);
  let stack = [];
  for (let part of parts) {
    if (part === '.') continue;
    if (part === '..') { stack.pop(); }
    else stack.push(part);
  }
  return '/' + stack.join('/');
}

function getNode(path) { return FS[path] || null; }

function promptStr() {
  let dir = cwd === '/home/user' ? '~' : cwd.replace('/home/user','~');
  return { user, hostname, dir };
}

const out = document.getElementById('output');

function printPrompt(cmd) {
  const p = promptStr();
  const div = document.createElement('div');
  div.className = 'prompt-line';
  div.innerHTML =
    `<span class="ps-user">${p.user}</span><span class="ps-at">@</span><span class="ps-host">${p.hostname}</span><span class="ps-colon">:</span><span class="ps-dir">${p.dir}</span><span class="ps-dollar">$</span><span class="ps-cmd"> ${escHtml(cmd)}</span>`;
  out.appendChild(div);
}

function printLine(html, cls='out-line') {
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = html;
  out.appendChild(div);
}

function print(text, color='') {
  const lines = String(text).split('\n');
  for (let ln of lines) {
    const div = document.createElement('div');
    div.className = 'out-line';
    div.innerHTML = color ? `<span class="${color}">${escHtml(ln)}</span>` : escHtml(ln);
    out.appendChild(div);
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scrollBottom() { out.scrollTop = out.scrollHeight; }

function updateLivePrompt() {
  const p = promptStr();
  document.getElementById('live-prompt').innerHTML =
    `<span class="ps-user">${p.user}</span><span class="ps-at">@</span><span class="ps-host">${p.hostname}</span><span class="ps-colon">:</span><span class="ps-dir">${p.dir}</span><span class="ps-dollar">$</span>`;
}

//

const CMDS = {

  help(args) {
    printLine(`<span class="c-accent c-bold">DoktorOS 1.0 — Available Commands</span>`);
    printLine('');
    const groups = [
      ['Navigation',  'cd, ls, ll, la, pwd, find'],
      ['Files',       'cat, touch, mkdir, rm, cp, mv, echo, head, tail, wc, grep, diff'],
      ['System',      'uname, whoami, id, hostname, uptime, date, ps, kill, top, free, df, du'],
      ['Languages',   'python3, node, gcc, go, rustc, ruby, java, javac, perl, bash'],
      ['Packages',    'apt, apt-get, pip3, npm, cargo, gem'],
      ['Network',     'ping, curl, wget, ifconfig, netstat, ssh'],
      ['Info',        'man, which, file, stat, env, export, history, alias'],
      ['Misc',        'clear, neofetch, lolcat, fortune, cowsay, sl, yes, cal, bc'],
    ];
    for (const [grp, cmds] of groups) {
      printLine(`  <span class="c-yellow c-bold">${grp.padEnd(12)}</span><span class="c-dim">${cmds}</span>`);
    }
    printLine('');
    printLine(`<span class="c-dim">Tip: try <span class="c-cyan">neofetch</span>, <span class="c-cyan">python3 ~/projects/hello.py</span>, or <span class="c-cyan">apt list --installed</span></span>`);
  },

  ls(args) {
    const flags = args.filter(a=>a.startsWith('-')).join('');
    const target = args.filter(a=>!a.startsWith('-'))[0] || cwd;
    const path = resolvePath(target);
    const node = getNode(path);
    if (!node) { print(`ls: cannot access '${target}': No such file or directory`,'c-red'); return; }
    if (node.type === 'file') { print(path.split('/').pop()); return; }
    const children = node.children || [];
    if (flags.includes('l') || flags.includes('a')) {
      if (flags.includes('l')) {
        printLine(`<span class="c-dim">total ${children.length * 4}</span>`);
        const items = flags.includes('a') ? ['.','..', ...children] : children;
        for (const name of items) {
          const childPath = path === '/' ? `/${name}` : `${path}/${name}`;
          const child = FS[childPath];
          const isDir = !child || child.type === 'dir';
          const isExec = child && child.exec;
          const perm = isDir ? 'drwxr-xr-x' : (isExec ? '-rwxr-xr-x' : '-rw-r--r--');
          const size = child?.content?.length || Math.floor(Math.random()*4096+512);
          const date = 'May  5 00:00';
          let cls = isDir ? 'c-cyan' : (isExec ? 'c-green' : 'c-white');
          printLine(`<span class="c-dim">${perm} 1 user user ${String(size).padStart(6)} ${date} </span><span class="${cls}">${escHtml(name)}${isDir?'/':''}</span>`);
        }
      }
    } else {
      const cols = 5;
      const items = children.filter(n => flags.includes('a') || !n.startsWith('.'));
      let row = '';
      items.forEach((name, i) => {
        const childPath = path === '/' ? `/${name}` : `${path}/${name}`;
        const child = FS[childPath];
        const isDir = !child || child.type === 'dir';
        const isExec = child?.exec;
        let cls = isDir ? 'c-cyan' : (isExec ? 'c-green' : 'c-white');
        row += `<span class="${cls}">${escHtml(name)}${isDir?'/':''}</span>  `;
        if ((i+1) % cols === 0 || i === items.length-1) {
          printLine(row);
          row = '';
        }
      });
    }
  },

  ll(args) { CMDS.ls(['-la', ...args]); },
  la(args) { CMDS.ls(['-a',  ...args]); },

  cd(args) {
    const target = args[0] || '/home/user';
    const path = resolvePath(target);
    const node = getNode(path);
    if (!node) { print(`bash: cd: ${target}: No such file or directory`,'c-red'); return; }
    if (node.type !== 'dir') { print(`bash: cd: ${target}: Not a directory`,'c-red'); return; }
    cwd = path;
    updateLivePrompt();
    buildFileTree();
  },

  pwd() { print(cwd); },

  cat(args) {
    if (!args.length) { print('cat: missing operand','c-red'); return; }
    for (const a of args) {
      const path = resolvePath(a);
      const node = getNode(path);
      if (!node) { print(`cat: ${a}: No such file or directory`,'c-red'); continue; }
      if (node.type === 'dir') { print(`cat: ${a}: Is a directory`,'c-red'); continue; }
      print(node.content || '(empty)');
    }
  },

  head(args) {
    const n = args.includes('-n') ? parseInt(args[args.indexOf('-n')+1])||10 : 10;
    const file = args.filter(a=>!a.startsWith('-'))[0];
    if (!file) { print('head: missing file','c-red'); return; }
    const node = getNode(resolvePath(file));
    if (!node || node.type==='dir') { print(`head: ${file}: No such file or directory`,'c-red'); return; }
    (node.content||'').split('\n').slice(0,n).forEach(l=>print(l));
  },

  tail(args) {
    const n = args.includes('-n') ? parseInt(args[args.indexOf('-n')+1])||10 : 10;
    const file = args.filter(a=>!a.startsWith('-'))[0];
    if (!file) { print('tail: missing file','c-red'); return; }
    const node = getNode(resolvePath(file));
    if (!node || node.type==='dir') { print(`tail: ${file}: No such file or directory`,'c-red'); return; }
    const lines = (node.content||'').split('\n');
    lines.slice(-n).forEach(l=>print(l));
  },

  touch(args) {
    if (!args.length) { print('touch: missing file operand','c-red'); return; }
    for (const a of args) {
      const path = resolvePath(a);
      if (!FS[path]) {
        FS[path] = { type:'file', content:'' };
        const parent = path.substring(0, path.lastIndexOf('/')) || '/';
        const name = path.split('/').pop();
        if (FS[parent]) { FS[parent].children = [...(FS[parent].children||[]), name]; }
      }
    }
    buildFileTree();
  },

  mkdir(args) {
    const flags = args.filter(a=>a.startsWith('-'));
    const dirs  = args.filter(a=>!a.startsWith('-'));
    if (!dirs.length) { print('mkdir: missing operand','c-red'); return; }
    for (const a of dirs) {
      const path = resolvePath(a);
      if (FS[path]) { print(`mkdir: cannot create directory '${a}': File exists`,'c-red'); continue; }
      FS[path] = { type:'dir', children:[] };
      const parent = path.substring(0, path.lastIndexOf('/')) || '/';
      const name = path.split('/').pop();
      if (FS[parent]) FS[parent].children = [...(FS[parent].children||[]), name];
    }
    buildFileTree();
  },

  rm(args) {
    const flags = args.filter(a=>a.startsWith('-')).join('');
    const files = args.filter(a=>!a.startsWith('-'));
    for (const a of files) {
      const path = resolvePath(a);
      const node = FS[path];
      if (!node) { print(`rm: cannot remove '${a}': No such file or directory`,'c-red'); continue; }
      if (node.type==='dir' && !flags.includes('r')) { print(`rm: cannot remove '${a}': Is a directory`,'c-red'); continue; }
      delete FS[path];
      const parent = path.substring(0, path.lastIndexOf('/')) || '/';
      const name = path.split('/').pop();
      if (FS[parent]) FS[parent].children = (FS[parent].children||[]).filter(c=>c!==name);
    }
    buildFileTree();
  },

  cp(args) {
    if (args.length < 2) { print('cp: missing destination file operand','c-red'); return; }
    const src = resolvePath(args[0]);
    const dst = resolvePath(args[args.length-1]);
    const node = FS[src];
    if (!node) { print(`cp: cannot stat '${args[0]}': No such file or directory`,'c-red'); return; }
    if (node.type==='file') {
      FS[dst] = { ...node };
      const parent = dst.substring(0, dst.lastIndexOf('/')) || '/';
      const name = dst.split('/').pop();
      if (FS[parent]) FS[parent].children = [...new Set([...(FS[parent].children||[]), name])];
    }
    buildFileTree();
  },

  mv(args) {
    if (args.length < 2) { print('mv: missing destination','c-red'); return; }
    CMDS.cp(args);
    CMDS.rm([args[0]]);
  },

  echo(args) {
    let text = args.join(' ');
    // handle env var substitution
    text = text.replace(/\$([A-Z_]+)/g, (_,k) => envVars[k] || '');
    print(text);
  },

  grep(args) {
    const flags = args.filter(a=>a.startsWith('-')).join('');
    const rest  = args.filter(a=>!a.startsWith('-'));
    if (rest.length < 1) { print('grep: usage: grep [options] pattern [file...]','c-red'); return; }
    const pattern = rest[0];
    const files = rest.slice(1);
    const regex = new RegExp(pattern, flags.includes('i') ? 'i' : '');
    if (!files.length) { print(`grep: pattern '${pattern}' (no files)`,'c-dim'); return; }
    for (const f of files) {
      const node = FS[resolvePath(f)];
      if (!node || node.type==='dir') { print(`grep: ${f}: No such file or directory`,'c-red'); continue; }
      const lines = (node.content||'').split('\n');
      lines.forEach((ln,i) => {
        if (regex.test(ln)) {
          if (files.length > 1) printLine(`<span class="c-purple">${escHtml(f)}:</span><span class="c-yellow">${i+1}:</span>${escHtml(ln).replace(new RegExp(escHtml(pattern),'gi'),m=>`<span class="c-red c-bold">${m}</span>`)}`);
          else printLine(escHtml(ln).replace(new RegExp(escHtml(pattern),'gi'),m=>`<span class="c-red c-bold">${m}</span>`));
        }
      });
    }
  },

  wc(args) {
    const files = args.filter(a=>!a.startsWith('-'));
    for (const f of files) {
      const node = FS[resolvePath(f)];
      if (!node || node.type==='dir') { print(`wc: ${f}: No such file or directory`,'c-red'); continue; }
      const content = node.content || '';
      const lines = content.split('\n').length;
      const words = content.trim().split(/\s+/).filter(Boolean).length;
      const bytes = content.length;
      printLine(`<span class="c-cyan">${String(lines).padStart(6)} ${String(words).padStart(6)} ${String(bytes).padStart(6)}</span> ${escHtml(f)}`);
    }
  },

  find(args) {
    const dir = args[0] ? resolvePath(args[0]) : cwd;
    const nameFlag = args.indexOf('-name');
    const pattern = nameFlag >= 0 ? args[nameFlag+1] : null;
    function walk(p) {
      const node = FS[p];
      if (!node) return;
      const base = p.split('/').pop() || '/';
      if (!pattern || base.includes(pattern.replace(/\*/g,''))) print(p);
      if (node.type==='dir') for (const child of node.children||[]) walk(p==='/'?`/${child}`:`${p}/${child}`);
    }
    walk(dir);
  },

  uname(args) {
    const flags = args.join('');
    if (flags.includes('a')) {
      print('Linux doktoros 6.8.0-doktoros #1 SMP Mon May 5 00:00:00 UTC 2025 x86_64 GNU/Linux');
    } else if (flags.includes('r')) { print('6.8.0-doktoros'); }
    else if (flags.includes('s')) { print('Linux'); }
    else { print('Linux'); }
  },

  whoami() { print(user); },
  id()     { print(`uid=1000(${user}) gid=1000(${user}) groups=1000(${user}),4(adm),27(sudo),1001(docker)`); },
  hostname(){ print(hostname); },

  uptime() {
    const s = Math.floor((Date.now()-startTime)/1000);
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    const load = (Math.random()*0.5+0.05).toFixed(2);
    print(` ${new Date().toTimeString().slice(0,8)} up ${h}:${String(m).padStart(2,'0')}, 1 user,  load average: ${load}, ${(load*0.9).toFixed(2)}, ${(load*0.8).toFixed(2)}`);
  },

  date(){ print(new Date().toString()); },

  ps(args) {
    const flags = args.join('');
    printLine(`<span class="c-yellow">  PID TTY          TIME CMD</span>`);
    PROCESSES.filter(p=> flags.includes('a') || p.user===user).forEach(p => {
      printLine(`<span class="c-cyan">${String(p.pid).padStart(5)}</span> <span class="c-dim">pts/0    </span><span class="c-dim">00:00:${String(Math.floor(p.cpu)).padStart(2,'0')}</span> <span class="c-white">${p.cmd}</span>`);
    });
  },

  kill(args) {
    const sig = args.find(a=>a.startsWith('-'))?.slice(1) || '15';
    const pids = args.filter(a=>!a.startsWith('-')).map(Number);
    for (const pid of pids) {
      const idx = PROCESSES.findIndex(p=>p.pid===pid);
      if (idx < 0) { print(`bash: kill: (${pid}) - No such process`,'c-red'); }
      else { PROCESSES.splice(idx,1); print(`[1]+  Terminated              (pid ${pid})`,'c-yellow'); }
    }
  },

  top() {
    printLine(`<span class="c-accent c-bold">DoktorOS top — Tasks: ${PROCESSES.length} total, 1 running</span>`);
    printLine(`<span class="c-dim">%Cpu(s): ${(Math.random()*15+2).toFixed(1)} us,  ${(Math.random()*3).toFixed(1)} sy,  0.0 ni, ${(Math.random()*5+75).toFixed(1)} id</span>`);
    printLine(`<span class="c-dim">MiB Mem :  8192.0 total,  7808.3 free,   312.2 used,    71.5 buff</span>`);
    printLine('');
    printLine(`<span class="c-yellow">  PID USER      PR  NI    VIRT    RES    SHR S  %CPU  %MEM     TIME+ COMMAND</span>`);
    PROCESSES.slice(0,12).forEach(p => {
      printLine(`<span class="c-cyan">${String(p.pid).padStart(5)}</span> <span class="c-green">${p.user.padEnd(9)}</span><span class="c-dim"> 20   0 ${String(p.mem+'m').padStart(7)} ${String(Math.floor(p.mem/4)+'m').padStart(6)} ${String(Math.floor(p.mem/8)+'m').padStart(6)} S ${String(p.cpu.toFixed(1)).padStart(5)} ${(p.mem/81.92).toFixed(1).padStart(5)} ${p.time}</span> <span class="c-white">${p.cmd}</span>`);
    });
  },

  free(args) {
    printLine(`<span class="c-yellow">               total        used        free      shared  buff/cache   available</span>`);
    printLine(`<span class="c-white">Mem:         </span><span class="c-cyan">8388608</span>      <span class="c-red">421892</span>     <span class="c-green">7523048</span>       <span class="c-dim">4096</span>      <span class="c-dim">443668</span>     <span class="c-green">7726716</span>`);
    printLine(`<span class="c-white">Swap:        </span><span class="c-cyan">2097152</span>           <span class="c-dim">0</span>     <span class="c-green">2097152</span>`);
  },

  df(args) {
    printLine(`<span class="c-yellow">Filesystem      Size  Used Avail Use% Mounted on</span>`);
    printLine(`<span class="c-white">/dev/sda1        50G   12G   36G  25% /</span>`);
    printLine(`<span class="c-white">/dev/sda2       200G   48G  140G  26% /home</span>`);
    printLine(`<span class="c-dim">tmpfs           4.0G     0  4.0G   0% /dev/shm</span>`);
    printLine(`<span class="c-dim">tmpfs           1.6G  1.2M  1.6G   1% /run</span>`);
  },

  du(args) {
    const target = args.filter(a=>!a.startsWith('-'))[0] || cwd;
    print(`4.0K\t${resolvePath(target)}`);
  },

  env() {
    for (const [k,v] of Object.entries(envVars)) printLine(`<span class="c-cyan">${k}</span>=<span class="c-yellow">${escHtml(v)}</span>`);
  },

  export(args) {
    for (const a of args) {
      const [k,v] = a.split('=');
      if (k && v !== undefined) envVars[k] = v;
    }
  },

  history() {
    history.forEach((cmd,i) => printLine(`<span class="c-dim">${String(i+1).padStart(4)}</span>  ${escHtml(cmd)}`));
  },

  which(args) {
    for (const a of args) {
      const bins = ['/usr/bin','/bin','/usr/local/bin'];
      const found = bins.find(b => FS[b] && (FS[b].children||[]).includes(a));
      if (found) print(`${found}/${a}`);
      else print(`which: no ${a} in (${bins.join(':')})`, 'c-red');
    }
  },

  file(args) {
    for (const a of args) {
      const node = FS[resolvePath(a)];
      if (!node) { print(`${a}: cannot open '${a}' (No such file or directory)`,'c-red'); continue; }
      if (node.type==='dir') print(`${a}: directory`);
      else if (node.exec) print(`${a}: ELF 64-bit LSB executable, x86-64`);
      else print(`${a}: ASCII text`);
    }
  },

  stat(args) {
    for (const a of args) {
      const path = resolvePath(a);
      const node = FS[path];
      if (!node) { print(`stat: cannot stat '${a}': No such file or directory`,'c-red'); continue; }
      const size = node.content?.length || 4096;
      printLine(`<span class="c-dim">  File:</span> <span class="c-white">${escHtml(a)}</span>`);
      printLine(`<span class="c-dim">  Size:</span> <span class="c-cyan">${size}</span>\t\t<span class="c-dim">Blocks: ${Math.ceil(size/512)}</span>`);
      printLine(`<span class="c-dim">  Type:</span> <span class="c-yellow">${node.type==='dir'?'directory':'regular file'}</span>`);
      printLine(`<span class="c-dim">Access:</span> <span class="c-white">${node.type==='dir'?'drwxr-xr-x':'-rw-r--r--'}</span>`);
    }
  },

  clear() { out.innerHTML = ''; },

  python3(args) {
    if (!args.length) { print('[Python 3.12.3 interactive — type exit() to quit]','c-yellow'); return; }
    const file = args[0];
    const node = FS[resolvePath(file)];
    if (!node || node.type==='dir') { print(`python3: can't open file '${file}': [Errno 2] No such file or directory`,'c-red'); return; }
    simulateRun('python3', file, node.content);
  },

  node(args) {
    if (!args.length) { print('[Node.js v22.1.0 REPL — .exit to quit]','c-yellow'); return; }
    const file = args[0];
    const node = FS[resolvePath(file)];
    if (!node || node.type==='dir') { print(`Error: Cannot find module '${file}'`,'c-red'); return; }
    simulateRun('node', file, node.content);
  },

  gcc(args) {
    const files = args.filter(a=>!a.startsWith('-'));
    const outFlag = args.indexOf('-o') >= 0 ? args[args.indexOf('-o')+1] : 'a.out';
    if (!files.length) { print('gcc: fatal error: no input files','c-red'); return; }
    print(`[gcc 13.2.0: compiling ${files.join(', ')} → ${outFlag}]`, 'c-dim');

//  SIMULATE LANGUAGE EXECUTION
// ═══════════════════════════════════════════
function simulateRun(runtime, file, content) {
  const lines = content.split('\n').filter(l => !l.startsWith('#') && !l.startsWith('//') && !l.startsWith('/*') && l.trim() && !l.startsWith('import') && !l.startsWith('package') && !l.startsWith('use ') && !l.startsWith('fn ') && !l.startsWith('public') && !l.startsWith('def ') && !l.startsWith('func ') && !l.startsWith('sub ') && !l.startsWith('.'));
  // Find print-like statements and extract strings
  const outputs = [];
  for (const ln of content.split('\n')) {
    const m = ln.match(/(?:println?|console\.log|puts|fmt\.Println|System\.out\.println|echo|printf)\s*\(?[`"']([^`"']+)[`"']/);
    if (m) outputs.push(m[1]);
    const m2 = ln.match(/(?:println?|console\.log|puts|fmt\.Println|System\.out\.println|echo)\s*\(?f?[`"']([^`"']+)[`"']/);
    if (m2 && !outputs.includes(m2[1])) outputs.push(m2[1]);
  }
  outputs.forEach(o => print(o));
  if (!outputs.length) print(`[Process exited with code 0]`,'c-dim');
}

// ═══════════════════════════════════════════
//  COMMAND EXECUTOR
// ═══════════════════════════════════════════
function exec(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;
  history.push(trimmed);
  histIdx = history.length;
  printPrompt(trimmed);

  // Handle piping (basic)
  if (trimmed.includes('|')) {
    const parts = trimmed.split('|').map(s=>s.trim());
    print(`[pipe: ${parts.join(' | ')} — simulated]`,'c-dim');
    return;
  }
  // Handle redirections (basic)
  if (trimmed.includes('>')) {
    const [cmd, outfile] = trimmed.split('>').map(s=>s.trim());
    const parts = tokenize(cmd);
    const name = parts[0]; const args = parts.slice(1);
    // capture output to file
    const path = resolvePath(outfile);
    if (!FS[path]) {
      FS[path] = { type:'file', content:'' };
      const parent = path.substring(0,path.lastIndexOf('/'))||'/';
      const n = path.split('/').pop();
      if (FS[parent]) FS[parent].children = [...new Set([...(FS[parent].children||[]),n])];
    }
    print(`[output redirected to ${outfile}]`,'c-dim');
    return;
  }

  const parts = tokenize(trimmed);
  if (!parts.length) return;
  const name = parts[0];
  const args = parts.slice(1);

  // env var assignment
  if (name.includes('=') && !name.startsWith('-')) {
    const [k,...vp] = name.split('=');
    envVars[k] = vp.join('=');
    return;
  }

  if (CMDS[name]) {
    try { CMDS[name](args); } catch(e) { print(`bash: ${name}: error: ${e.message}`,'c-red'); }
  } else {
    // check if it's an executable file
    const node = FS[resolvePath(name)];
    if (node && node.exec) {
      simulateRun('bash', name, node.content || '');
    } else if (node && node.type==='file') {
      print(`bash: ${name}: Permission denied`,'c-red');
    } else {
      print(`bash: ${name}: command not found`,'c-red');
    }
  }
  scrollBottom();
}

function tokenize(s) {
  const tokens = [];
  let cur = '', inQ = false, qChar = '';
  for (const ch of s) {
    if (inQ) {
      if (ch === qChar) inQ = false;
      else cur += ch;
    } else if (ch==='"' || ch==="'") { inQ=true; qChar=ch; }
    else if (ch===' ') { if (cur) tokens.push(cur); cur=''; }
    else cur += ch;
  }
  if (cur) tokens.push(cur);
  return tokens;
}

// ═══════════════════════════════════════════
//  INPUT HANDLING
// ═══════════════════════════════════════════
const input = document.getElementById('cmd-input');
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    exec(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; input.value = history[histIdx] || ''; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx < history.length-1) { histIdx++; input.value = history[histIdx] || ''; }
    else { histIdx = history.length; input.value = ''; }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    autocomplete(input.value);
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault(); CMDS.clear([]);
  } else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    printPrompt(input.value + '^C');
    input.value = '';
  }
});

function autocomplete(val) {
  const parts = tokenize(val);
  if (!parts.length) return;
  if (parts.length === 1) {
    // complete command
    const prefix = parts[0];
    const matches = Object.keys(CMDS).filter(c=>c.startsWith(prefix));
    if (matches.length === 1) { input.value = matches[0] + ' '; }
    else if (matches.length > 1) {
      printPrompt(val);
      printLine(matches.map(m=>`<span class="c-cyan">${m}</span>`).join('  '));
      scrollBottom();
    }
  } else {
    // complete file path
    const last = parts[parts.length-1];
    const dir = last.includes('/') ? resolvePath(last.substring(0,last.lastIndexOf('/'))) : cwd;
    const base = last.includes('/') ? last.substring(last.lastIndexOf('/')+1) : last;
    const node = FS[dir];
    if (node && node.type==='dir') {
      const matches = (node.children||[]).filter(c=>c.startsWith(base));
      if (matches.length===1) {
        const prefix = last.includes('/') ? last.substring(0,last.lastIndexOf('/')+1) : '';
        input.value = parts.slice(0,-1).join(' ') + ' ' + prefix + matches[0];
      } else if (matches.length>1) {
        printPrompt(val);
        printLine(matches.map(m=>`<span class="c-cyan">${m}</span>`).join('  '));
        scrollBottom();
      }
    }
  }
}

// ═══════════════════════════════════════════
//  FILE TREE PANEL
// ═══════════════════════════════════════════
function buildFileTree() {
  const tree = document.getElementById('file-tree');
  tree.innerHTML = '';
  function render(path, depth) {
    const node = FS[path];
    if (!node) return;
    const name = path === '/' ? '/' : path.split('/').pop();
    if (depth > 0) {
      const item = document.createElement('div');
      item.className = 'tree-item ' + (node.type==='dir' ? 'dir' : (node.exec?'exec':''));
      item.style.paddingLeft = (12 + depth*14) + 'px';
      const icon = node.type==='dir' ? (path===cwd?'📂':'📁') : (node.exec?'⚙':'📄');
      item.innerHTML = `${icon} ${escHtml(name)}`;
      if (node.type==='dir') item.onclick = () => { CMDS.cd([path]); };
      else item.onclick = () => { exec(`cat ${path}`); };
      tree.appendChild(item);
    }
    if (node.type==='dir' && depth < 3) {
      for (const child of (node.children||[]).slice(0,12)) {
        const childPath = path==='/'?`/${child}`:`${path}/${child}`;
        render(childPath, depth+1);
      }
    }
  }
  render('/home/user', 0);
  render('/home/user', -1); // show root-level
  // show current dir contents
  const node = FS[cwd];
  if (node && node.type==='dir') {
    const header = document.createElement('div');
    header.className = 'tree-item dir';
    header.style.fontWeight='600'; header.style.color='var(--accent)';
    header.innerHTML = `📂 ${cwd.replace('/home/user','~')}`;
    tree.prepend(header);
    for (const child of (node.children||[])) {
      const childPath = cwd==='/'?`/${child}`:`${cwd}/${child}`;
      const cn = FS[childPath];
      const item = document.createElement('div');
      item.className = 'tree-item ' + (!cn||cn.type==='dir'?'dir':(cn.exec?'exec':''));
      item.style.paddingLeft = '26px';
      const icon = !cn||cn.type==='dir'?'📁':(cn.exec?'⚙':'📄');
      item.innerHTML = `${icon} ${escHtml(child)}`;
      if (!cn||cn.type==='dir') item.onclick = () => CMDS.cd([childPath]);
      else item.onclick = () => exec(`cat ${childPath}`);
      tree.appendChild(item);
    }
  }
}

//  TABS
// ═══════════════════════════════════════════
function switchTab(i) {
  activeTab = i;
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  updateLivePrompt();
}
function newTab() {
  const i = tabs.length;
  tabs.push({ title:'terminal', cwd });
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.id = `tab-${i}`;
  tab.innerHTML = `<span>🖥️ terminal</span><button class="tab-close" onclick="closeTab(event,${i})">×</button>`;
  tab.onclick = () => switchTab(i);
  document.getElementById('tabs').insertBefore(tab, document.getElementById('new-tab-btn'));
  switchTab(i);
}
function closeTab(e, i) {
  e.stopPropagation();
  if (tabs.length <= 1) return;
  tabs.splice(i,1);
  const tabEls = document.querySelectorAll('.tab');
  tabEls[i]?.remove();
  switchTab(Math.max(0, i-1));
}

// ═══════════════════════════════════════════
//  CLOCK + UPTIME + METRICS
// ═══════════════════════════════════════════
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toTimeString().slice(0,8);
  const s = Math.floor((Date.now()-startTime)/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  document.getElementById('uptime').textContent = `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  // fake CPU
  const cpu = (Math.random()*10+5);
  document.getElementById('cpu-bar').style.width = cpu+'%';
  document.getElementById('loadavg').textContent = (cpu/100*1.5+0.05).toFixed(2);
}
setInterval(tick, 1000); tick();

function showApp(name) {
  document.querySelectorAll('.taskbtn').forEach(b=>b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (name==='processes') { exec('top'); }
  else if (name==='network') { exec('ifconfig'); }
  else if (name==='packages') { exec('apt list --installed'); }
  else if (name==='editor') { exec('nano'); }
  input.focus();
}

async function boot() {
  const log = document.getElementById('boot-log');
  const bar = document.getElementById('boot-bar');
  for (let i=0; i<bootMessages.length; i++) {
    await new Promise(r=>setTimeout(r, 40+Math.random()*60));
    const { msg, color } = bootMessages[i];
    const div = document.createElement('div');
    div.innerHTML = color ? `<span class="${color}">${escHtml(msg)}</span>` : escHtml(msg);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    bar.style.width = ((i+1)/bootMessages.length*100) + '%';
  }
  await new Promise(r=>setTimeout(r,400));
  // fade out
  const bootEl = document.getElementById('boot');
  bootEl.style.transition = 'opacity 0.8s';
  bootEl.style.opacity = '0';
  await new Promise(r=>setTimeout(r,800));
  bootEl.remove();
